<% require "dotenv"; Dotenv.load(".env.deploy") if File.exist?(".env.deploy") -%>

service: metis

image: metis

ssh:
  user: ubuntu

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_WEB_IP") %>
  job:
    hosts:
      - <%= ENV.fetch("KAMAL_JOB_IP") %>
    cmd: bin/jobs
    # :docker agent runtime (DooD): the job container shells out to the
    # host daemon to launch pi containers. The socket is mounted on this
    # role ONLY (never web) — it grants host-level daemon access, so keep
    # it off the internet-facing role; run the daemon rootless to cap the
    # blast radius (docs/coding-runtime.md). The agent dir is bind-mounted
    # at an identical path on host and container so the per-turn workspace
    # bind mount the daemon performs resolves to the same files
    # (METIS_PERSISTENT_ROOT below). Provision gVisor + the metis-pi image
    # on the host first. Drop these options when running e2b/daytona.
    #
    # group-add: the container runs as uid 1000 (rails); the socket is
    # root:docker 660, so the process must join the host's docker group to
    # use it. 988 is `getent group docker` on the job host — re-check if the
    # host is reprovisioned.
    options:
      group-add: "988"
      volume:
        - "/var/run/docker.sock:/var/run/docker.sock"
        - "/srv/metis/agent:/srv/metis/agent"

proxy:
  ssl: false
  host: <%= ENV.fetch("METIS_HOST") %>

registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - CABLE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CLOUDFLARE_EMAIL_API_TOKEN # or SMTP_PASSWORD when METIS_MAIL_DELIVERY is smtp
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - GEMINI_API_KEY
    - DEEPSEEK_API_KEY
    - FIREWORKS_API_KEY
    - MOONSHOT_API_KEY
    - SERPER_API_KEY
    - BRAVE_SEARCH_API_KEY
    - GITHUB_APP_CLIENT_ID
    - GITHUB_APP_CLIENT_SECRET
    - GITHUB_APP_PRIVATE_KEY
    - GITHUB_APP_WEBHOOK_SECRET
    - LINEAR_CLIENT_ID
    - LINEAR_CLIENT_SECRET
    - LINEAR_WEBHOOK_SECRET
    - GOOGLE_OAUTH_CLIENT_ID
    - GOOGLE_OAUTH_CLIENT_SECRET
    - GOOGLE_OAUTH_IOS_CLIENT_ID
    - E2B_API_KEY
    - DAYTONA_API_KEY
    - LANGFUSE_PUBLIC_KEY
    - LANGFUSE_SECRET_KEY
  clear:
    # Email transport (docs/configuration.md#email--account-access). For
    # SMTP instead: METIS_MAIL_DELIVERY: smtp, SMTP_ADDRESS / SMTP_PORT /
    # SMTP_USERNAME here, SMTP_PASSWORD under env/secret above.
    METIS_MAIL_DELIVERY: cloudflare
    METIS_MAIL_FROM: "Metis <noreply@<%= ENV.fetch('METIS_HOST') %>>"
    CLOUDFLARE_ACCOUNT_ID: <%= ENV.fetch("CLOUDFLARE_ACCOUNT_ID") %>
    METIS_APP_HOST: <%= ENV.fetch("METIS_HOST") %>
    METIS_REGISTRATION_MODE: invite_only
    METIS_AGENT_RUNTIME: docker
    # OCI runtime for pi containers — "runsc" = gVisor (requires gVisor
    # registered on the job host's daemon). Confines untrusted agent code.
    METIS_DOCKER_RUNTIME: runsc
    # Persistent agent root — MUST match the job-role host bind mount above
    # so the per-turn workspace mount is path-identical under DooD. The host
    # dir must be writable by the container's runtime uid (rails = 1000).
    METIS_PERSISTENT_ROOT: /srv/metis/agent
    # 14 days idle before a conversation's workspace/ is warm-evicted
    # (sessions kept — see docs/session-persistence.md).
    METIS_DOCKER_WORKSPACE_EVICTION_HOURS: "336"
    METIS_AGENT_PROVIDER: anthropic
    METIS_AGENT_MODEL: anthropic/claude-opus-4-8
    METIS_E2B_TEMPLATE: metis-pi
    METIS_E2B_EVICTION_HOURS: "24"
    METIS_DAYTONA_SNAPSHOT: metis-pi
    METIS_DAYTONA_AUTO_STOP_MINUTES: "120"
    METIS_DAYTONA_AUTO_ARCHIVE_MINUTES: "60"
    METIS_DAYTONA_AUTO_DELETE_MINUTES: "1440"
    METIS_DAYTONA_KEEP_WARM_SECONDS: "300"
    GITHUB_APP_ID: "<%= ENV.fetch('GITHUB_APP_ID') %>"
    GITHUB_APP_SLUG: <%= ENV.fetch("GITHUB_APP_SLUG") %>
    GITHUB_APP_INSTALLATION_ID: "<%= ENV.fetch('GITHUB_APP_INSTALLATION_ID') %>"
    RAILS_MAX_THREADS: "5"
    AWS_BUCKET: <%= ENV.fetch("AWS_BUCKET") %>
    AWS_REGION: <%= ENV.fetch("AWS_REGION") %>
    JOB_CONCURRENCY: "3"
    WEB_CONCURRENCY: "2"
    METIS_LANGFUSE_ENABLED: "<%= ENV.fetch('METIS_LANGFUSE_ENABLED', '') %>"
    LANGFUSE_HOST: <%= ENV.fetch("LANGFUSE_HOST", "https://cloud.langfuse.com") %>
    METIS_LANGFUSE_INCLUDE_CONTENT: "<%= ENV.fetch('METIS_LANGFUSE_INCLUDE_CONTENT', '') %>"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "metis_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: arm64
  context: .
