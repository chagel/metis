production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  evict_paused_e2b_sandboxes:
    class: EvictPausedSandboxesJob
    schedule: every hour at minute 7
  evict_docker_workspaces:
    class: EvictDockerWorkspacesJob
    schedule: every hour at minute 37
  reap_stalled_turns:
    class: ReapStalledTurnsJob
    schedule: every 5 minutes
  run_due_routines:
    class: RoutineSchedulerJob
    schedule: every minute
  reclaim_silent_bridge_tasks:
    class: ReclaimSilentBridgeTasksJob
    schedule: every 5 minutes
