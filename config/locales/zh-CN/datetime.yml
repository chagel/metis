# ActionView distance_in_words for time_ago_in_words / distance_of_time_in_words.
# Bundled for "en" by ActionView but absent for zh-CN — without this, helpers
# raise "Translation missing: zh-CN.datetime.distance_in_words.*". Chinese has
# no plural distinction, but the default pluralizer still selects :one at
# count == 1, so each key carries both :one and :other.
"zh-CN":
  datetime:
    distance_in_words:
      half_a_minute: "半分钟"
      less_than_x_seconds:
        one: "不到 %{count} 秒"
        other: "不到 %{count} 秒"
      x_seconds:
        one: "%{count} 秒"
        other: "%{count} 秒"
      less_than_x_minutes:
        one: "不到 %{count} 分钟"
        other: "不到 %{count} 分钟"
      x_minutes:
        one: "%{count} 分钟"
        other: "%{count} 分钟"
      about_x_hours:
        one: "大约 %{count} 小时"
        other: "大约 %{count} 小时"
      x_days:
        one: "%{count} 天"
        other: "%{count} 天"
      about_x_months:
        one: "大约 %{count} 个月"
        other: "大约 %{count} 个月"
      x_months:
        one: "%{count} 个月"
        other: "%{count} 个月"
      about_x_years:
        one: "大约 %{count} 年"
        other: "大约 %{count} 年"
      over_x_years:
        one: "超过 %{count} 年"
        other: "超过 %{count} 年"
      almost_x_years:
        one: "将近 %{count} 年"
        other: "将近 %{count} 年"
    relative:
      future: "%{time}后"
      past: "%{time}前"
