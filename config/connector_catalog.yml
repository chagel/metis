# The connector marketplace catalog — curated MCP-server "apps".
#
# Each entry is a template: connecting one resolves it (with any user
# `inputs`) into a team's Connector, and the `credential` schema shapes
# the secret the user supplies into a ConnectorCredential. See
# docs/connectors.md.
#
# auth:
#   token      — the user supplies a key/token
#   oauth      — Metis brokers an OAuth flow; per-member access tokens
#   mcp_oauth  — OAuth via the MCP spec (discovery + Dynamic Client
#                Registration); no pre-registered provider app needed.
#                See docs/mcp-oauth-connectors.md.

notion:
  name: Notion
  category: Productivity
  description: Read, search, and update Notion pages and databases.
  transport: http
  definition:
    url: https://mcp.notion.com/mcp
  auth: mcp_oauth

monday:
  name: monday.com
  category: Productivity
  description: Manage boards, items, and updates in monday.com.
  transport: http
  definition:
    url: https://mcp.monday.com/mcp
  auth: mcp_oauth

stripe:
  name: Stripe
  category: Finance
  description: Look up customers, payments, invoices, and subscriptions in Stripe.
  transport: http
  definition:
    url: https://mcp.stripe.com
  auth: mcp_oauth

close:
  name: Close
  category: Sales
  description: Search and update leads, contacts, and opportunities in Close CRM.
  transport: http
  definition:
    url: https://mcp.close.com/mcp
  auth: mcp_oauth

sentry:
  name: Sentry
  category: Development
  description: Investigate issues, errors, and releases across your Sentry projects.
  transport: http
  definition:
    url: https://mcp.sentry.dev/mcp
  auth: mcp_oauth

asana:
  name: Asana
  category: Productivity
  description: Manage tasks, projects, and portfolios in Asana.
  transport: http
  definition:
    url: https://mcp.asana.com/mcp
  auth: mcp_oauth

paypal:
  name: PayPal
  category: Finance
  description: Look up orders, payments, invoices, and disputes in PayPal.
  transport: http
  definition:
    url: https://mcp.paypal.com/mcp
  auth: mcp_oauth

# Self-hosted: the member supplies their own Metabase URL; the same
# discovery + DCR flow runs against that instance's embedded OAuth server.
metabase:
  name: Metabase
  category: Analytics
  description: Query questions, dashboards, and models in your Metabase instance.
  transport: http
  definition:
    url: "%{instance_url}/api/mcp"
  auth: mcp_oauth
  inputs:
    - key: instance_url
      label: Metabase URL
      placeholder: https://metabase.example.com

github:
  name: GitHub
  category: Development
  description: Repositories, issues, pull requests, and code search.
  transport: http
  definition:
    url: https://api.githubcopilot.com/mcp/
  auth: oauth
  oauth_provider: github
  oauth_scopes:
    - repo
    - read:user
  credential:
    header: Authorization
    format: "Bearer %{token}"

# The Google connectors (gmail, google_calendar, google_drive) do not
# stage an MCP server. The agent reaches Google via the `gws` CLI
# (https://github.com/googleworkspace/cli), which Runtime::Base#sandbox_env
# authorises by exporting GOOGLE_WORKSPACE_CLI_TOKEN — the operator's
# Google access token, the same one a workspace MCP server would have
# been handed as a bearer. The bearer's scopes (the union of every
# Google connector the user has connected) decide what `gws` can call.
# The connector entries below therefore have no `definition.url` and
# no `credential`; they exist as marketplace tiles + an oauth_scopes
# manifest that drives the consent screen.
gmail:
  name: Gmail
  category: Productivity
  description: Search, read, draft, and label Gmail messages as the operator.
  transport: cli
  auth: oauth
  oauth_provider: google
  # Mirrors what `gws gmail` needs end-to-end: readonly (search/get)
  # + labels + modify (label_thread/message) + compose (draft/send).
  # One consent screen covers every Gmail skill the agent has.
  oauth_scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    - https://www.googleapis.com/auth/gmail.labels
    - https://www.googleapis.com/auth/gmail.modify
    - https://www.googleapis.com/auth/gmail.compose

linear:
  name: Linear
  category: Development
  description: Read and manage Linear issues, projects, comments, and cycles.
  transport: http
  definition:
    url: https://mcp.linear.app/mcp
  auth: mcp_oauth

google_calendar:
  name: Google Calendar
  category: Productivity
  description: Read and manage calendars, events, and invitations as the operator.
  transport: cli
  auth: oauth
  oauth_provider: google
  # Read + write on the user's calendars and event collection — what
  # `gws calendar` (list/get/create/update/delete events, list
  # calendars, +agenda, +insert) needs end-to-end.
  oauth_scopes:
    - https://www.googleapis.com/auth/calendar
    - https://www.googleapis.com/auth/calendar.events

google_drive:
  name: Google Drive
  category: Productivity
  description: Browse, search, and upload files in Google Drive as the operator.
  transport: cli
  auth: oauth
  oauth_provider: google
  # What `gws drive` needs end-to-end: list/get on the user's files
  # and shared drives, plus create/update for +upload and metadata
  # writes.
  oauth_scopes:
    - https://www.googleapis.com/auth/drive
    - https://www.googleapis.com/auth/drive.file
